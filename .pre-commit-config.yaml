repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
  - repo: https://github.com/biomejs/pre-commit
    rev: "v2.6.3"
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.6.3"]
  - repo: local
    hooks:
      - id: card-js-syntax
        name: card JS syntax (node --check)
        entry: bash -c 'for f in "$@"; do node --check "$f" || exit 1; done' --
        language: system
        files: \.js$
