name: Screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

# Protected main is never pushed to: the job commits the refreshed screenshots
# back onto the pull request's own branch, so they land through the normal merge.
# actions: write lets the job re-run the checks on the screenshots commit (see below).
permissions:
  contents: write
  actions: write

concurrency:
  group: screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Render screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fork PR branches do not exist in this repository: only check out the
          # head branch for same-repo PRs (where screenshots get pushed back).
          # Everything else keeps the default ref — for a fork PR that is the merge
          # ref, which github.ref_name ("N/merge") does not resolve to.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      # Download the browser binary (no apt here) separately from its system libraries, so the apt work all sits in
      # the one time-boxed, retried step below and a hung mirror can never stall an unguarded install.
      - name: Install Chromium
        timeout-minutes: 10
        run: npx playwright install chromium
      # ffmpeg (required, not preinstalled) + Roboto + the browser's apt deps, each apt call time-boxed and retried
      # so a flaky mirror is abandoned and retried instead of hanging; fail loudly if ffmpeg is still missing.
      - name: Install ffmpeg, Roboto and browser deps
        timeout-minutes: 12
        run: |
          ok=
          for i in 1 2 3; do
            timeout 150 sudo apt-get update \
              && timeout 300 sudo apt-get install -y ffmpeg fonts-roboto \
              && timeout 300 npx playwright install-deps chromium \
              && { ok=1; break; }
            echo "apt attempt $i failed or timed out, retrying in 15s"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::apt failed 3 times"; exit 1; }
          ffmpeg -version > /dev/null
      # npm run screenshots builds the bundle first, then renders the stills and the animation GIFs.
      - name: Render screenshots
        run: |
          set -o pipefail
          npm run screenshots 2>&1 | tee /tmp/screenshots.log || {
            echo "::error::screenshots failed: $(tail -c 1200 /tmp/screenshots.log | tr -d '\r' | tr '\n' ' ')"
            exit 1
          }
      - name: Commit refreshed screenshots
        id: push
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$(git status --porcelain screenshots)" ]; then
            echo "No screenshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "chore: refresh screenshots"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # A push made with GITHUB_TOKEN triggers no pull_request run, but workflow_dispatch does: re-run the PR checks
      # on the new head so the screenshots commit gets its own Lint / Validate / HACS results.
      - name: Re-run checks on the screenshot commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in lint.yml validate.yml hacs.yml; do
            [ -f ".github/workflows/$wf" ] && gh workflow run "$wf" --ref "${{ github.head_ref }}"
          done
      - name: Upload screenshots (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: screenshots
          path: screenshots/
