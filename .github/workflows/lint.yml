name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by Release, so that a version is published only once these checks pass.
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  biome:
    name: Biome (card JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # One Biome version everywhere: read from the pre-commit hook, which Dependabot bumps; the hook's npm package
      # and the biome.json schema must carry the same version.
      - name: Read Biome version from .pre-commit-config.yaml
        id: biome-version
        run: |
          version=$(awk '/biomejs\/pre-commit/ {f=1} f && /rev:/ {gsub(/"/, ""); sub(/.*rev:[ ]*v?/, ""); print; exit}' .pre-commit-config.yaml)
          test -n "$version"
          grep -qF "@biomejs/biome@$version" .pre-commit-config.yaml || { echo "::error file=.pre-commit-config.yaml::additional_dependencies is not @biomejs/biome@$version"; exit 1; }
          grep -qF "schemas/$version/schema.json" biome.json || { echo "::error file=biome.json::\$schema is not Biome $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
        with:
          version: ${{ steps.biome-version.outputs.version }}
      - run: biome ci --reporter=github .
  duplication:
    name: Duplication (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npx --yes jscpd@5.4.2 .
      - name: Annotate duplicates
        if: always()
        run: node .github/scripts/jscpd-annotate.mjs
