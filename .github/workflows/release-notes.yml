name: Update release notes

# Rewrites a published release's title and notes from its CHANGELOG.md section.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Update notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          .github/scripts/release-notes.sh "${TAG#v}" > notes.md
          test -s notes.md
          gh release edit "$TAG" --title "$TAG" --notes-file notes.md
